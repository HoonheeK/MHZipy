name: "Build and Deploy to Cloudflare R2"

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies
        run: npm install

      # 1. Tauri 빌드
      - name: build tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 2. 빌드 결과물 업로드 및 updater.json 자동 생성
      - name: Upload to Cloudflare R2 & Generate Updater JSON
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4
          
          $Version = "${{ github.ref_name }}"
          
          # 계정 ID에 이미 https:// 가 포함되어 있는지 검사하여 엔드포인트를 안전하게 구성합니다.
          $RawAccountID = "${env:ACCOUNT_ID}".Trim()
          if ($RawAccountID -match "^https?://") {
              $Endpoint = $RawAccountID
          } else {
              $Endpoint = "https://${RawAccountID}.r2.cloudflarestorage.com"
          }
          
          $BundlePath = "src-tauri/target/release/bundle/nsis"
          
          # [1] 전체 파일 업로드
          aws s3 cp $BundlePath s3://${env:BUCKET_NAME}/$Version --recursive --endpoint-url $Endpoint
          
          # [2] 홈페이지 고정 다운로드 링크용 최신 실행파일 덮어쓰기
          $ExeFile = Get-ChildItem -Path $BundlePath -Filter "*setup.exe" | Select-Object -First 1
          if ($ExeFile) {
            aws s3 cp $($ExeFile.FullName) s3://${env:BUCKET_NAME}/latest-setup.exe --endpoint-url $Endpoint
          }

          # [3] updater.json 자동 생성 및 업로드
          $SigFile = Get-ChildItem -Path $BundlePath -Filter "*.sig" | Select-Object -First 1
          
          if ($SigFile -and $ExeFile) {
            $Signature = Get-Content $SigFile.FullName -Raw
            $ExeFileName = $ExeFile.Name
            
            $DownloadUrl = "https://mhzipy-update.marh-sw.com/$Version/$ExeFileName"
            
            $UpdaterObj = @{
                version = $Version.TrimStart('v')
                notes = "새로운 업데이트가 출시되었습니다! ($Version)"
                pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                platforms = @{
                    "windows-x86_64" = @{
                        signature = $Signature.Trim()
                        url = $DownloadUrl
                    }
                }
            }
            
            $UpdaterJson = $UpdaterObj | ConvertTo-Json -Depth 5
            Set-Content -Path "updater.json" -Value $UpdaterJson
            
            aws s3 cp updater.json s3://${env:BUCKET_NAME}/updater.json --endpoint-url $Endpoint
            Write-Host "✅ updater.json 생성 및 업로드 완료!"
          } else {
            Write-Host "⚠️ 서명 파일(.sig) 또는 설치 파일(.exe)을 찾을 수 없습니다."
            exit 1
          }
