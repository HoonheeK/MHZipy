        window.closeSearch = () => {
            searchBar.classList.remove('visible');
            document.querySelectorAll('.highlight').forEach(el => (/** @type {HTMLElement} */ (el)).style.display = 'none');
        };
        document.getElementById('search-close').onclick = window.closeSearch;

        // 단축키 핸들러
        window.addEventListener('keydown', async (e) => {
            const isCtrl = e.ctrlKey || e.metaKey;
            const key = e.key;
            const keyLower = key.toLowerCase();

            // 검색 입력 중일 때는 화살표 단축키 무시
            if (document.activeElement === searchInput && (key === 'ArrowLeft' || key === 'ArrowRight')) {
                return;
            }

            if (isCtrl && keyLower === 'f') {
                e.preventDefault();
                searchBar.classList.add('visible');
                document.querySelectorAll('.highlight').forEach(el => (/** @type {HTMLElement} */ (el)).style.display = 'block');
                searchInput.focus();
                searchInput.select();
            }
            else if (key === 'Escape') {
                window.closeSearch();
            }
            else if (isCtrl && keyLower === 'n' && !searchBar.classList.contains('visible')) {
                e.preventDefault();
                if (!pdfDoc) return;
                showPageInput();
            }
            else if (key === 'ArrowRight' || key === 'ArrowLeft') {
                e.preventDefault();
                const scrollContainer = document.getElementById('viewer-scroll-container');
                const containerRect = scrollContainer.getBoundingClientRect();
                const pages = document.querySelectorAll('.page-wrapper');
                
                let visibleCount = 0;
                for (let i = 0; i < pages.length; i++) {
                    const rect = pages[i].getBoundingClientRect();
                    const visibleTop = Math.max(rect.top, containerRect.top);
                    const visibleBottom = Math.min(rect.bottom, containerRect.bottom);
                    const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                    
                    // 페이지의 30% 이상이 보이거나, 화면 높이의 50% 이상을 덮고 있으면 보이는 것으로 간주
                    if (visibleHeight > rect.height * 0.3 || visibleHeight > containerRect.height * 0.5) {
                        visibleCount++;
                    }
                }
                
                const step = Math.max(1, visibleCount);
                const currentPageEl = document.getElementById('current-page');
                const currentPage = parseInt(currentPageEl.textContent) || 1;
                
                if (key === 'ArrowRight' && pdfDoc && currentPage < pdfDoc.numPages) {
                    goToPage(Math.min(pdfDoc.numPages, currentPage + step), true);
                } else if (key === 'ArrowLeft' && pdfDoc && currentPage > 1) {
                    goToPage(Math.max(1, currentPage - step), true);
                }
            }
            else if (key === ' ' && !e.ctrlKey) {
                if (isRegionCaptureMode && regionBounds) {
                    e.preventDefault();
                    // 현재 보이는 페이지를 기준으로 캡쳐
                    const currentPageEl = document.getElementById('current-page');
                    const currentPageNum = parseInt(currentPageEl.textContent) || 1;
                    const activePageEl = document.getElementById(`page-${currentPageNum}`);
                    if (activePageEl) {
                        const box = activePageEl.querySelector('.region-select-box');
                        if (box && box.style.display !== 'none') {
                            const rect = box.getBoundingClientRect();
                            if (rect.width > 5 && rect.height > 5) {
                                doCapture({
                                    left: rect.left,
                                    top: rect.top,
                                    width: rect.width,
                                    height: rect.height
                                });
                            }
                        }
                    }
                }
            }
        });

        // 컨텍스트 메뉴 (복사/하이라이트)
        const contextMenu = document.getElementById('context-menu');
        
        document.addEventListener('mouseup', (e) => {
            if (isResizing) return; // 리사이징 중이면 무시
            if (isPanMode) return; // 패닝 모드일 때는 무시

            const selection = window.getSelection();
            if (selection.isCollapsed) {
                contextMenu.style.display = 'none';
                return;
            }

            // 선택 영역이 뷰어 내부에 있는지 확인
            const viewerContainer = document.getElementById('viewer-scroll-container');
            if (!viewerContainer.contains(selection.anchorNode)) return;

            // 메뉴 위치 계산
            contextMenu.style.left = `${e.pageX + 5}px`;
            contextMenu.style.top = `${e.pageY + 5}px`;
            contextMenu.style.display = 'block';
        });

        document.addEventListener('mousedown', (e) => {
            if (!contextMenu.contains(e.target)) {
                contextMenu.style.display = 'none';
            }

            // 페이지 선택 (줌 앵커용)
            const pageWrapper = e.target.closest('.page-wrapper');
            if (pageWrapper) {
                const pageNum = parseInt(pageWrapper.id.replace('page-', ''));
                selectPage(pageNum);
            } else if (!e.target.closest('#sidebar') && !e.target.closest('#zoom-controls') && !e.target.closest('#page-indicator')) {
                // 페이지 바깥 클릭 시 선택 해제
                selectPage(null);
            }
        });

        document.getElementById('ctx-copy').onclick = () => {
            document.execCommand('copy');
            contextMenu.style.display = 'none';
        };

        document.getElementById('ctx-highlight').onclick = () => {
            const selection = window.getSelection();
            if (selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const rects = range.getClientRects();
            const pages = document.querySelectorAll('.page-wrapper');

            for (const rect of rects) {
                for (const page of pages) {
                    const pageRect = page.getBoundingClientRect();
                    // 겹치는 페이지 찾기 (간단한 포함 확인)
                    if (rect.top >= pageRect.top && rect.bottom <= pageRect.bottom &&
                        rect.left >= pageRect.left && rect.right <= pageRect.right) {
                        
                        const div = document.createElement('div');
                        div.className = 'user-highlight';
                        div.style.left = `${rect.left - pageRect.left}px`;
                        div.style.top = `${rect.top - pageRect.top}px`;
                        div.style.width = `${rect.width}px`;
                        div.style.height = `${rect.height}px`;
                        page.appendChild(div);
                    }
                }
            }
            
            selection.removeAllRanges();
            contextMenu.style.display = 'none';
        };

        // 마우스 휠 줌 (Ctrl + Wheel) - 마우스 커서 기준 앵커 줌
        window.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    updateZoom(0.25, e.clientX, e.clientY);
                } else {
                    updateZoom(-0.25, e.clientX, e.clientY);
                }
            }
        }, { passive: false });

        pageInputContainer.addEventListener('click', (e) => {
            if (e.target.id === 'current-page') {
                showPageInput();
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch(searchInput.value);
            }
        });

        document.getElementById('search-next').onclick = () => {
            if (searchResults.length === 0) return;
            currentSearchIndex = (currentSearchIndex + 1) % searchResults.length;
            updateSearchFocus();
        };

        document.getElementById('search-prev').onclick = () => {
            if (searchResults.length === 0) return;
            currentSearchIndex = (currentSearchIndex - 1 + searchResults.length) % searchResults.length;
            updateSearchFocus();
        };

        document.getElementById('rotate-ccw').onclick = async () => {
            currentRotation = (currentRotation - 90 + 360) % 360;
            await renderPages();
        };
        
        document.getElementById('rotate-cw').onclick = async () => {
            currentRotation = (currentRotation + 90) % 360;
            await renderPages();
        };

        document.getElementById('zoom-in').onclick = () => updateZoom(0.25);
        document.getElementById('zoom-out').onclick = () => updateZoom(-0.25);

        const fitWidthBtn = document.getElementById('fit-width');
        if (fitWidthBtn) {
            fitWidthBtn.onclick = async () => {
                isFitWidthMode = true;
                await fitToWidth();
                await renderPages();
            };
        }

        // 창 크기 변경 시 폭 맞춤 모드 유지 (디바운스 처리)
        let _resizeTimer = null;
        window.addEventListener('resize', () => {
            if (isFitWidthMode && pdfDoc) {
                clearTimeout(_resizeTimer);
                _resizeTimer = setTimeout(async () => {
                    await fitToWidth();
                    await renderPages();
                }, 120);
            }
        });

        const zoomInput = document.getElementById('zoom-level');
        zoomInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                let val = parseInt(zoomInput.value.replace('%', ''));
                if (isNaN(val)) {
                    zoomInput.value = Math.round(currentScale * 100) + '%';
                    return;
                }
                val = Math.max(10, Math.min(1000, val));
                const newScale = val / 100;
                isFitWidthMode = false;
                updateZoom(newScale - currentScale);
                zoomInput.blur();
            }
        });
        zoomInput.addEventListener('blur', () => {
            zoomInput.value = Math.round(currentScale * 100) + '%';
        });

        // 키보드 네비게이션 (화살표, 페이지업/다운, 스페이스)
        window.addEventListener('keydown', (e) => {
            const tagName = e.target.tagName.toLowerCase();
            if (tagName === 'input' || tagName === 'textarea') return;

            const currentPageSpan = document.getElementById('current-page');
            if (!currentPageSpan) return;
            const currentPageNum = parseInt(currentPageSpan.textContent);

            switch (e.key) {
                case 'ArrowLeft':
                case 'ArrowUp':
                case 'PageUp':
                    e.preventDefault();
                    goToPage(currentPageNum - 1, true);
                    break;
                case 'ArrowRight':
                case 'ArrowDown':
                case 'PageDown':
                case ' ':
                    e.preventDefault();
                    goToPage(currentPageNum + 1, true);
                    break;
            }
        });

        // URL 파라미터 또는 전역 변수에서 데이터 읽기
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('file');
        const storageId = params.get('storageId');
        const pdfPath = params.get('pdfPath') || window.__PDF_PATH__;
        const title = params.get('title') || document.title;

        if (window.__PDF_BASE64__) {
            renderPdf(null, title, null);
        } else if (pdfPath) {
            const isWindows = navigator.userAgent.includes('Windows');
            const customUrl = (isWindows ? "http://pdf-data.localhost/" : "pdf-data://localhost/") + encodeURIComponent(pdfPath);
            renderPdf(customUrl, title, null);
        } else if (fileUrl || storageId) {
            renderPdf(fileUrl, title, storageId);
        }

        // 윈도우 종료 시 문서 파기
        window.addEventListener('beforeunload', () => {
            if (pdfDoc) {
                pdfDoc.destroy();
                pdfDoc = null;
            }
        });

        // Status bar source updater
        function updateStatusBarSource(sourcePath) {
            const el = document.getElementById('pdf-status-source');
            if (el && sourcePath) {
                el.innerHTML = `<span style="color: #64748b;">Source PPTX:</span> <span style="color: #38bdf8; font-weight: 500;" title="${sourcePath}">${sourcePath}</span>`;
            }
        }

        // --- PDF Viewer Custom Window Controls ---
        const initPdfWindowControls = () => {
            const filenameEl = document.getElementById('pdf-header-filename');
            const pathEl = document.getElementById('pdf-header-path');

            const fullPath = pdfPath || fileUrl || '';
            let fileName = title || 'PDF Viewer';
            if (fullPath) {
                const parts = fullPath.split(/[/\\]/);
                if (parts.length > 0 && parts[parts.length - 1]) {
                    fileName = parts[parts.length - 1];
                }
            }

            if (filenameEl) filenameEl.textContent = fileName;
            if (pathEl && fullPath) {
                pathEl.textContent = `— ${fullPath}`;
                pathEl.title = fullPath;
            }

            const btnMin = document.getElementById('pdf-btn-minimize');
            const btnMax = document.getElementById('pdf-btn-maximize');
            const btnClose = document.getElementById('pdf-btn-close');
            const dragSpacer = document.getElementById('pdf-header-drag-spacer');
            const iconMax = document.getElementById('pdf-icon-max');

            const getTauriInvoke = () => window.__TAURI__?.core?.invoke;
            const getTauriWindow = () => window.__TAURI__?.window?.getCurrentWindow?.();

            let isMax = false;
            const updateMaxState = async () => {
                try {
                    const invoke = getTauriInvoke();
                    if (invoke) {
                        isMax = await invoke('is_window_maximized');
                    } else {
                        const win = getTauriWindow();
                        if (win) isMax = await win.isMaximized();
                    }
                    if (iconMax) {
                        if (isMax) {
                            btnMax.title = "Restore Down";
                            iconMax.innerHTML = '<rect x="5" y="7" width="13" height="13" rx="1.5" ry="1.5" /><polyline points="8 5 19 5 19 16" />';
                        } else {
                            btnMax.title = "Maximize";
                            iconMax.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2" ry="2" />';
                        }
                    }
                } catch (e) {}
            };

            updateMaxState();

            try {
                const win = getTauriWindow();
                if (win && win.onResized) {
                    win.onResized(updateMaxState);
                }
            } catch (e) {}

            if (btnMin) {
                btnMin.onclick = async (e) => {
                    e.stopPropagation();
                    try {
                        const invoke = getTauriInvoke();
                        if (invoke) await invoke('minimize_window');
                        else getTauriWindow()?.minimize();
                    } catch (err) {
                        getTauriWindow()?.minimize();
                    }
                };
            }

            const toggleMax = async (e) => {
                if (e) e.stopPropagation();
                try {
                    const invoke = getTauriInvoke();
                    if (invoke) {
                        isMax = await invoke('toggle_maximize');
                    } else {
                        const win = getTauriWindow();
                        if (win) {
                            await win.toggleMaximize();
                            isMax = await win.isMaximized();
                        }
                    }
                    updateMaxState();
                } catch (err) {
                    getTauriWindow()?.toggleMaximize();
                    updateMaxState();
                }
            };

            if (btnMax) {
                btnMax.onclick = toggleMax;
            }

            if (btnClose) {
                btnClose.onclick = async (e) => {
                    e.stopPropagation();
                    try {
                        const invoke = getTauriInvoke();
                        if (invoke) await invoke('close_window');
                        else getTauriWindow()?.close();
                    } catch (err) {
                        getTauriWindow()?.close();
                    }
                };
            }

            if (dragSpacer) {
                dragSpacer.onmousedown = (e) => {
                    if (e.button === 0) {
                        try {
                            getTauriWindow()?.startDragging();
                        } catch {}
                    }
                };
                dragSpacer.ondblclick = toggleMax;
            }
        };

        initPdfWindowControls();
    </script>
</body>
</html>
